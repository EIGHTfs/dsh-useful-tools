# 单测 CI：push 到 master 与所有 PR 都跑一遍 node --test。
# 测试零依赖（只用 node:test / node:assert），因此不需要 npm install，也没有缓存可做。
# 矩阵覆盖 Linux 与 Windows + 常见 Node 版本；fail-fast 关闭，一次能看到全部组合的结果。
#
# 为什么传目录而不是 glob（node --test test）：Windows 的默认 shell 不展开 *.mjs，
#   glob 会被原样传给 Node 导致找不到测试文件。传目录由 Node 自己递归收集，两端一致。
name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node test/run-tests.mjs
